services:
  - type: web
    name: mangavault-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    plan: starter
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENABLE_STARTUP_BOTS
        value: false